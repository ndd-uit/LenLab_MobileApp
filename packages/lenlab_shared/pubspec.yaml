name: lenlab_shared
description: LENLAB P2 models, repository and reusable UI.
publish_to: none
version: 1.0.0
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/fonts/
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers.ttf
    - family: Cousine
      fonts:
        - asset: assets/fonts/Cousine-Bold.ttf
          weight: 700
